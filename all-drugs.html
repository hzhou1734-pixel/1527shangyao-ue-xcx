<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>全部服务 - 上药GO</title>
<link rel="stylesheet" href="css/common.css">

</head>
<body data-page="all-drugs">
<div class="app-container" id="app">
<div class="toast" id="toast"></div>
<div class="page active" id="allDrugsPage">
    <div class="nav-bar" style="background:var(--white);color:var(--text);">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      全部服务
    </div>

    <div style="padding:12px 16px;background:var(--white);border-bottom:1px solid var(--border);">
      <div style="display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;">
        <div class="filter-chip active" onclick="filterDrugs(this,'all')">全部</div>
        <div class="filter-chip" onclick="filterDrugs(this,'immunoglobulin')">免疫球蛋白</div>
        <div class="filter-chip" onclick="filterDrugs(this,'albumin')">人血白蛋白</div>
        <div class="filter-chip" onclick="filterDrugs(this,'factor')">凝血因子</div>
      </div>
    </div>

    <div style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--white);margin-bottom:8px;">
      <span style="font-size:13px;color:var(--text-secondary);">共 <b style="color:var(--text);" class="drug-count-num">13</b> 款服务</span>
      <div style="display:flex;gap:16px;">
        <span class="sort-item active" onclick="sortDrugs(this,'default')">综合排序</span>
        <span class="sort-item" onclick="sortDrugs(this,'distance')">距离优先</span>
        <span class="sort-item" onclick="sortDrugs(this,'stock')">库存优先</span>
      </div>
    </div>

    <div class="all-drug-list" id="allDrugList" style="padding:0 16px;"></div>
    <div class="loading-more">— 已显示全部服务 —</div>
  </div>


</div>

<script src="js/app.js"></script>
</body>
</html>
