<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>登录 - 上药GO</title>
<link rel="stylesheet" href="css/common.css?v=1.0.41">

</head>
<body data-page="login">
<div class="app-container" id="app">
<div class="toast" id="toast"></div>
<div class="login-page active" id="loginPage">
    <div class="login-header">
      <div class="login-logo">药</div>
      <div class="login-title">上药GO</div>
      <div class="login-subtitle">便民找药 · 就在身边</div>
    </div>
    <div class="login-card">
      <button class="login-btn" id="loginBtn" disabled onclick="doLogin()">
        <svg viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.24 1.02l-2.2 2.2z"/></svg>
        <span class="login-btn-text">手机号码授权登录</span>
      </button>
      <label class="login-agree">
        <input type="checkbox" id="loginAgree" class="login-agree-check" onchange="onLoginAgreeChange()">
        <span class="login-agree-text">已阅读并同意 <a href="javascript:void(0)" onclick="showUserAgreement()">《用户协议》</a> 和 <a href="javascript:void(0)" onclick="showPrivacy()">《隐私政策》</a></span>
      </label>
    </div>
  </div>


</div>

<script src="js/app.js?v=1.0.41"></script>
</body>
</html>
