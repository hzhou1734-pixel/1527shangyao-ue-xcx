<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>关于我们 - 上药GO</title>
<link rel="stylesheet" href="css/common.css">

</head>
<body data-page="about">
<div class="app-container" id="app">
<div class="toast" id="toast"></div>
<div class="page active" id="aboutPage">
    <div class="nav-bar" style="background:var(--white);color:var(--text);position:sticky;top:0;z-index:100;">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      关于我们
    </div>
    <div class="about-section">
      <div class="about-logo">
        <div class="about-logo-icon">药</div>
        <div class="about-logo-name">上药GO</div>
      </div>
    </div>
    <div class="about-section">
      <div class="about-item" onclick="showAboutIntro()">
        <span class="about-item-label">平台介绍</span>
        <span class="about-item-value">便民找药平台 ›</span>
      </div>
      <a class="about-item" href="tel:400-XXX-XXXX">
        <span class="about-item-label">联系电话</span>
        <span class="about-item-value">400-XXX-XXXX 📞</span>
      </a>
    </div>
    <div class="about-section">
      <div class="about-item" onclick="showPrivacy()">
        <span class="about-item-label">隐私政策</span>
        <span class="about-item-value">›</span>
      </div>
      <div class="about-item" onclick="showUserAgreement()">
        <span class="about-item-label">用户协议</span>
        <span class="about-item-value">›</span>
      </div>
      <div class="about-item" onclick="showServiceAgreement()">
        <span class="about-item-label">服务协议</span>
        <span class="about-item-value">›</span>
      </div>
    </div>
    <div class="about-footer">上药GO · 便民找药平台 · 版本 v1.0.26</div>
  </div>


</div>

<!-- 平台介绍弹窗 -->
<div class="modal-overlay" id="aboutIntroModal" onclick="if(event.target===this)closeAboutIntro()">
  <div class="modal-content">
    <div class="modal-title">平台介绍</div>
    <div class="modal-text">上药GO是上海医药旗下便民找药平台，致力于为患者提供血液制品等特殊服务的在线查询与预约服务。我们与上海地区正规资质诊所深度合作，确保服务来源正规、品质放心。</div>
    <button class="modal-ok-btn" onclick="closeAboutIntro()">我知道了</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
