<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>诊所登录 - 上药GO</title>
<link rel="stylesheet" href="css/common.css?v=1.0.40">

</head>
<body data-page="merchant-login">
<div class="app-container" id="app">
<div class="toast" id="toast"></div>
<div class="page active" id="merchantLoginPage">
    <div class="nav-bar" style="background:var(--white);color:var(--text);position:sticky;top:0;z-index:100;">
      <div class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      诊所登录
    </div>

    <div class="login-header">
      <div class="login-logo">诊</div>
      <div class="login-title">诊所中心</div>
      <div class="login-subtitle">上药GO · 诊所后台</div>
    </div>

    <div class="login-card">
      <div class="login-tabs">
        <div class="login-tab active" id="tabPwd" onclick="switchMerchantLoginTab('pwd')">密码登录</div>
        <div class="login-tab" id="tabCode" onclick="switchMerchantLoginTab('code')">验证码登录</div>
      </div>

      <input class="login-phone-input" type="tel" placeholder="请输入诊所手机号" id="merchantLoginPhone" maxlength="11" value="13800138001" style="margin-top:14px;" oninput="refreshMerchantPwdTab()">

      <div id="panePwd">
        <input class="login-phone-input" type="password" placeholder="请输入登录密码" id="merchantLoginPwd" value="123456" style="margin-top:10px;">
        <div class="login-hint" id="pwdHint" style="display:none;">该账号尚未设置密码，请使用验证码或微信验证登录后设置</div>
        <button class="btn-primary" id="merchantPwdBtn" style="margin-top:16px;width:100%;height:44px;border-radius:22px;" onclick="doMerchantLogin()">登录</button>
      </div>

      <div id="paneCode" style="display:none;">
        <div class="login-code-row" style="margin-top:10px;">
          <input class="login-phone-input" type="tel" placeholder="请输入验证码" id="merchantLoginCode" maxlength="6" style="flex:1;">
          <button class="btn-code" id="merchantSendCodeBtn" onclick="sendMerchantCode()">获取验证码</button>
        </div>
        <button class="btn-wechat" onclick="merchantWechatPhone()">微信快速验证手机号</button>
        <button class="btn-primary" id="merchantCodeBtn" style="margin-top:16px;width:100%;height:44px;border-radius:22px;" onclick="doMerchantCodeLogin()">登录</button>
      </div>

      <div class="login-links">
        <a href="javascript:void(0)" onclick="goMerchantChangePassword()">修改密码</a>
      </div>

      <label class="login-agree" id="merchantAgreeRow">
        <input type="checkbox" id="merchantAgree" class="login-agree-check" onchange="onMerchantAgreeChange()">
        <span class="login-agree-text">我已阅读并同意 <a href="javascript:void(0)" onclick="showUserAgreement()">《用户协议》</a> 和 <a href="javascript:void(0)" onclick="showPrivacy()">《隐私政策》</a></span>
      </label>
    </div>
  </div>

  <!-- 首次登录设置新密码（可跳过） -->
  <div class="modal-overlay" id="merchantSetPwdModal" style="display:none;">
    <div class="set-pwd-card">
      <div class="set-pwd-title">设置登录密码</div>
      <div class="set-pwd-tip">为保障账号安全，首次登录请设置新密码（也可稍后设置）</div>
      <input class="login-phone-input" type="password" id="merchantNewPwd" placeholder="请输入新密码（至少6位）" maxlength="20">
      <input class="login-phone-input" type="password" id="merchantNewPwd2" placeholder="请再次输入新密码" maxlength="20" style="margin-top:10px;">
      <button class="btn-primary" style="margin-top:16px;width:100%;height:44px;border-radius:22px;" onclick="confirmMerchantSetPwd()">确认设置</button>
      <button class="set-pwd-skip" onclick="skipMerchantSetPwd()">暂不设置，跳过</button>
    </div>
  </div>

</div>

<script src="js/app.js?v=1.0.40"></script>
</body>
</html>
